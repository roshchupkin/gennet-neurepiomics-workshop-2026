name: Workshop notebook

on:
  push:
    branches: [main]
  pull_request:

jobs:
  practical:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.11'
            tensorflow: '2.15.1'
          - python: '3.12'
            tensorflow: '2.20.0'
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '3'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt tensorflow==${{ matrix.tensorflow }}
      - run: python -m ipykernel install --user --name python3
      - run: python scripts/build_notebook.py && git diff --exit-code -- notebooks/01_gennet_in_one_hour.ipynb
      - run: python -m pytest -q
      - run: python scripts/execute_notebook.py --output /tmp/completed.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: completed-notebook-tf-${{ matrix.tensorflow }}
          path: /tmp/completed.ipynb
